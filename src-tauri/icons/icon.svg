<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LAT app icon</title>
  <desc id="desc">A geometric LAT monogram on a rounded deep-blue gradient background.</desc>

  <defs>
    <linearGradient id="background" x1="42" y1="28" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071631"/>
      <stop offset="0.52" stop-color="#0A2C5B"/>
      <stop offset="1" stop-color="#0C5274"/>
    </linearGradient>
    <radialGradient id="backgroundGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(252 106) rotate(90) scale(292)">
      <stop offset="0" stop-color="#2B7AA0" stop-opacity="0.52"/>
      <stop offset="0.48" stop-color="#14527F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#062040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueT" x1="254" y1="160" x2="347" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C4CF5"/>
      <stop offset="1" stop-color="#145BFF"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="193" y1="282" x2="263" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6BE8BC"/>
      <stop offset="1" stop-color="#58DDB0"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="16" y="16" width="480" height="480" rx="84"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="84" fill="url(#background)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="url(#backgroundGlow)" clip-path="url(#iconClip)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="82.5" fill="none" stroke="#2A6382" stroke-opacity="0.36" stroke-width="3"/>

  <g id="monogram" transform="translate(10 7)">
    <path fill="#FFFFFF" d="M234 160h166v43h-54v135l-40-64v-71h-45z"/>
    <path fill="url(#greenAccent)" d="M228 282l35 56h-70z"/>
    <path fill="#FFFFFF" d="M92 160h46v134h61.5882352941l-27.1764705882 44H92z"/>
    <path fill="#FFFFFF" d="M228 170l104 168h-48l-56-90-21 34h-49z"/>
