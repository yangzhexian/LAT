[package]
name = "hy-mt2-local-translator"
version = "0.1.1-beta.2"
description = "LAT local llama.cpp translation desktop app"
authors = ["LLM-Translate"]
edition = "2021"

[lib]
name = "hy_mt2_local_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
